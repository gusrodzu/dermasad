---
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html/dermasad-preview/
    - /bin/mkdir -p "$DEPLOYPATH"
    - /bin/mkdir -p "$DEPLOYPATH/assets"
    - /bin/cp index.html styles.css script.js "$DEPLOYPATH"
    - /usr/bin/find assets -maxdepth 1 -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' -o -iname '*.svg' \) -exec /bin/cp '{}' "$DEPLOYPATH/assets/" \;
